name: Deploy to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          mkdir deploy
          cp -r .next deploy/.next
          cp -r public deploy/public
          cp -r src deploy/src
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp next.config.js deploy/next.config.js
          cp tailwind.config.js deploy/tailwind.config.js
          cp postcss.config.js deploy/postcss.config.js
          cp tsconfig.json deploy/tsconfig.json
          cp server.js deploy/server.js

      - name: Upload files to Namecheap
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.NAMECHEAP_HOST }}
          REMOTE_USER: ${{ secrets.NAMECHEAP_USER }}
          REMOTE_PORT: ${{ secrets.NAMECHEAP_PORT }}
          SOURCE: "deploy/"
          TARGET: ${{ secrets.NAMECHEAP_APP_PATH }}
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/node_modules/, /.git/"

      - name: Install production dependencies and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAMECHEAP_HOST }}
          username: ${{ secrets.NAMECHEAP_USER }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          port: ${{ secrets.NAMECHEAP_PORT }}
          script: |
            cd ${{ secrets.NAMECHEAP_APP_PATH }}
            npm install --omit=dev
            touch tmp/restart.txt || true
