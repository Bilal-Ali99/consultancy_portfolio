<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="420" height="160">
  <defs>
    <style>
      .word { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Monochrome circle (no gradient, no opacity) -->
  <circle cx="400" cy="290" r="170" fill="#14202F"/>

  <!-- Chevrons in monochrome -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355,205 L275,290 L355,375"/>
    <path d="M445,205 L525,290 L445,375"/>
  </g>

  <!-- Center dot in monochrome -->
  <circle cx="400" cy="290" r="16" fill="#FFFFFF"/>

  <!-- Text in single color -->
  <text x="400" y="560" text-anchor="middle" class="word"
        font-size="72" font-weight="700" fill="#14202F">
    HB Solutions
  </text>

  <text x="400" y="605" text-anchor="middle" class="word"
        font-size="24" font-weight="500" letter-spacing="4" fill="#14202F">
    ERP &#8226; SOFTWARE &#8226; INTEGRATION
  </text>
</svg>
