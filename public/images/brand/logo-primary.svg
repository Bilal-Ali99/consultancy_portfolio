<svg width="420" height="160" viewBox="0 0 420 160" xmlns="http://www.w3.org/2000/svg">
  <title>HB Solutions (Primary)</title>

  <!-- Scale + center original 800×800 logo into 420×160 -->
  <g transform="translate(180,-10) scale(0.20)">

    <defs>
      <style>.word { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; }</style>
      <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6D28D9"/>
        <stop offset="100%" stop-color="#4F46E5"/>
      </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="400" cy="290" r="170" fill="#0f172a" opacity="0.15" transform="translate(9,15)"/>
    <circle cx="400" cy="290" r="170" fill="url(#g4)"/>

    <!-- Chevrons -->
    <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M355,205 L275,290 L355,375"/>
      <path d="M445,205 L525,290 L445,375"/>
    </g>

    <!-- Center dot -->
    <circle cx="400" cy="290" r="16" fill="#22D3EE"/>

    <!-- HB Solutions text -->
    <text x="400" y="560" text-anchor="middle" class="word"
          font-size="72" font-weight="700" fill="#0F172A">
      HB <tspan fill="#6D28D9">Solutions</tspan>
    </text>

    <!-- Subtitle -->
    <text x="400" y="605" text-anchor="middle" class="word"
          font-size="24" font-weight="500" letter-spacing="4" fill="#64748B">
      ERP &#8226; SOFTWARE &#8226; INTEGRATION
    </text>

  </g>
</svg>
